[project]
name = "bd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "build123d>=0.11.1",
    "ocp-vscode>=4.0.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "SIM117", # build123d's BuildPart/BuildSketch/BuildLine nesting is idiomatic, not incidental
]

[tool.pyright]
include = ["."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
